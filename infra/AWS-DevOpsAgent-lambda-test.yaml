AWSTemplateFormatVersion: '2010-09-09'
Description: 'Isolated AWS DevOps Agent Lambda Error Test Stack for AIOps assignment'
Resources:
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: TestFunctionLogsOnly
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: logs:CreateLogGroup
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/AWS-DevOpsAgent-test-lambda'
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/AWS-DevOpsAgent-test-lambda:*'
      Tags:
        - Key: Purpose
          Value: AWS-DevOpsAgent-Testing
  TestLambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: AWS-DevOpsAgent-test-lambda
      Runtime: python3.12
      Handler: index.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Code:
        ZipFile: |
          import json
          import random
          from datetime import datetime, timezone

          def lambda_handler(event, context):
              print(f"AWS DevOpsAgent Test Lambda - {datetime.now(timezone.utc).isoformat()}")
              print(f"Event: {json.dumps(event)}")
              scenarios = [
                  "Simulated database connection timeout",
                  "Test API rate limit exceeded",
                  "Intentional validation error for AWS DevOpsAgent testing",
              ]
              message = random.choice(scenarios)
              print(f"Generating test error: {message}")
              raise Exception(f"AWS DevOpsAgent Test Error: {message}")
      Description: 'Assignment lab only: intentionally raises exceptions'
      Timeout: 30
      Tags:
        - Key: Purpose
          Value: AWS-DevOpsAgent-Testing
  LambdaErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: AWS-DevOpsAgent-Lambda-Error-Test
      AlarmDescription: 'Assignment lab: Lambda Errors > 0'
      MetricName: Errors
      Namespace: AWS/Lambda
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: FunctionName
          Value: !Ref TestLambdaFunction
      TreatMissingData: notBreaching
Outputs:
  LambdaFunctionName:
    Value: !Ref TestLambdaFunction
  LambdaFunctionArn:
    Value: !GetAtt TestLambdaFunction.Arn
  AlarmName:
    Value: !Ref LambdaErrorAlarm
